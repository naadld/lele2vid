services:
  # Base Runner Service
  pinyinquiz:
    build:
      context: .
      dockerfile: Dockerfile
    image: lelehoctiengtrung-pinyinquiz:latest
    container_name: lele_pinyinquiz_runner
    extra_hosts:
      - "vpsg24gb:100.79.174.89"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
      - ./configs:/app/configs
      - ./assets:/app/assets
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://vpsg24gb:20130/v1
      - LLM_MODEL=gemini-2.5-flash
    command: ["video-gen"]

  # Service: Ideation (Generate 5 HSK Batches using LLM vpsg24gb:20130 into Google Sheets)
  ideation:
    image: lelehoctiengtrung-pinyinquiz:latest
    container_name: lele_pinyin_ideation
    extra_hosts:
      - "vpsg24gb:100.79.174.89"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
      - ./configs:/app/configs
      - ./assets:/app/assets
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://vpsg24gb:20130/v1
      - LLM_MODEL=gemini-2.5-flash
    command: ["ideation"]

  # Service: Video Generation (Render 1080p60 & Upload to Google Drive)
  videogen:
    image: lelehoctiengtrung-pinyinquiz:latest
    container_name: lele_pinyin_videogen
    extra_hosts:
      - "vpsg24gb:100.79.174.89"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
      - ./configs:/app/configs
      - ./assets:/app/assets
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://vpsg24gb:20130/v1
      - LLM_MODEL=gemini-2.5-flash
    command: ["video-gen"]
