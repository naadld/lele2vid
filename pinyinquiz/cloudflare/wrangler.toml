name = "lele-pinyinquiz"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "3591f5b61af3263ca14af7a1765cc954"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cron Triggers (UTC):
# - 18:00 UTC = 01:00 AM VN -> Lịch sản xuất mẻ 1: Sinh idea & Render video
# - 00:00 UTC = 07:00 AM VN -> Lịch đăng video Buffer lần 1 (Sáng)
# - 01:00 UTC = 08:00 AM VN -> Báo cáo Dashboard tự động buổi sáng (08:00)
# - 03:00 UTC = 10:00 AM VN -> Lịch sản xuất mẻ 2: Sinh idea & Render video
# - 06:00 UTC = 13:00 PM VN -> Lịch đăng video Buffer lần 2 (Chiều)
# - 11:01 UTC = 18:01 PM VN -> Báo cáo Dashboard tự động cuối ngày (18:01)
[triggers]
crons = ["0 18 * * *", "0 0 * * *", "0 1 * * *", "0 3 * * *", "0 6 * * *", "1 11 * * *"]

[vars]
SPREADSHEET_ID = "1b6LNl7JHRiCsjK1w9VuD86GLqAfmSOtDUOm5whrGdH0"
SHEET_TAB_NAME = "pinyin"
TELEGRAM_CHAT_ID = "1187577977"
GITHUB_REPO_OWNER = "naadld"
GITHUB_REPO_NAME = "lele2vid"
GITHUB_WORKFLOW_FILE = "daily_render.yml"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct"
GEMINI_MODEL = "gemini-3.6-flash"
AGNES_MODEL = "agnes-2.0-flash"
AGNES_BASE_URL = "https://apihub.agnes-ai.com/v1"

# Secrets to be configured via `wrangler secret put <KEY>`:
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - TELEGRAM_WEBHOOK_SECRET
# - GCP_SERVICE_ACCOUNT_EMAIL
# - GCP_SERVICE_ACCOUNT_PRIVATE_KEY
# - GITHUB_TOKEN
# - BUFFER_ACCESS_TOKEN
# - BUFFER_PROFILE_IDS (Comma separated: tiktok_id,facebook_id,youtube_id)
