name: Daily Pinyin TikTok Video Render

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    # Runs everyday at 03:00 AM GMT+7 (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Manim render quality (ql=480p, qm=720p, qh=1080p60, qk=4K)'
        required: false
        default: 'qh'
      row_id:
        description: 'Specific Row ID to render (leave empty to render all Pending)'
        required: false
        default: ''
      generate_ideas:
        description: 'Tự động tạo 5 bộ ý tưởng & metadata mới (true/false)'
        required: false
        default: 'false'

jobs:
  render_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache Pip Wheels for ultrafast install
      - name: Cache Pip Wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pinyinquiz/requirements.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Edge-TTS generated speech audio files
      - name: Cache Edge-TTS Word Audio
        uses: actions/cache@v4
        with:
          path: pinyinquiz/assets/audio/words
          key: ${{ runner.os }}-edge-tts-${{ hashFiles('pinyinquiz/assets/audio/words/**') }}
          restore-keys: |
            ${{ runner.os }}-edge-tts-

      - name: Install System Dependencies & CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev pkg-config libcairo2-dev \
            sox libsox-fmt-all fonts-noto-cjk fonts-wqy-zenhei fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r pinyinquiz/requirements.txt

      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p pinyinquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > pinyinquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      # Optional: Sinh 5 ý tưởng + Metadata mới nếu được kích hoạt
      - name: Generate Daily Batches & Metadata
        if: ${{ inputs.generate_ideas == 'true' || inputs.generate_ideas == true }}
        working-directory: pinyinquiz
        env:
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "Generating 5 new HSK batches with social media metadata..."
          python scripts/generate_daily_batches.py

      # Thực thi kết xuất video Manim và tải lên Google Drive
      - name: Execute Video Render & Upload
        working-directory: pinyinquiz
        env:
          RENDER_QUALITY: ${{ inputs.quality || 'qh' }}
          TARGET_ROW: ${{ inputs.row_id || '' }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          CMD="python scripts/run_batch.py --from-sheet --quality $RENDER_QUALITY --upload-gdrive"
          if [ -n "$TARGET_ROW" ]; then
            CMD="$CMD --row-id $TARGET_ROW"
          fi
          echo "Executing: $CMD"
          eval $CMD

      # Gửi thông báo kết quả qua Telegram Bot (Bảo mật 100% qua GitHub Secrets)
      - name: Send Telegram Notification
        if: always()
        working-directory: pinyinquiz
        env:
          JOB_STATUS: ${{ job.status }}
          RENDER_QUALITY: ${{ inputs.quality || 'qh' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          
          bot_token = os.getenv('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()
          
          if not (bot_token and chat_id):
              print('Telegram secrets not configured. Skipping notification.')
              exit(0)
              
          status = os.getenv('JOB_STATUS', 'UNKNOWN')
          quality = os.getenv('RENDER_QUALITY', 'qh')
          status_icon = '✅ THÀNH CÔNG' if status == 'success' else '❌ THẤT BẠI'
          
          text = f'''🤖 <b>[GitHub Actions] Báo Cáo Render Video PinyinQuiz</b>
          
Trạng thái: <b>{status_icon}</b>
Chất lượng: <b>{quality}</b>
Nền tảng: <b>GitHub Actions Cloud Runner</b>
Google Sheet: Đã đồng bộ Video Link & Metadata vào tab <code>pinyin</code>.'''
          
          try:
              res = requests.post(
                  f'https://api.telegram.org/bot{bot_token}/sendMessage',
                  data={'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'},
                  timeout=15
              )
              if res.status_code == 200:
                  print('Telegram notification sent successfully.')
              else:
                  print(f'Telegram send status: {res.status_code}')
          except Exception as e:
              print('Could not send Telegram notification.')
          "

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f pinyinquiz/configs/service_account.json
          echo "Credentials cleaned up."
