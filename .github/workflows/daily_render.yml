name: Pinyin TikTok Video Render Pipeline

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Manim render quality (ql, qm, qh, qk)'
        required: false
        default: 'qh'
      row_id:
        description: 'Specific Row ID to render (leave empty to render all Pending)'
        required: false
        default: ''

# 🛑 TỰ ĐỘNG HỦY TIẾN TRÌNH CŨ: Ngăn chặn các Action thừa xếp hàng gây nghẽn
concurrency:
  group: pinyin-render-pipeline
  cancel-in-progress: true

jobs:
  render_videos:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Install FFmpeg & System Libraries (1-2 giây)
      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libpango1.0-dev libcairo2-dev || true

      # 2. Register Bundled CJK Fonts (0.1 giây)
      - name: Register Bundled CJK Fonts
        run: |
          mkdir -p ~/.fonts
          cp pinyinquiz/assets/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f || true

      # 3. Cache Python Virtual Environment (Khôi phục trong 2-3 giây)
      - name: Cache Python Virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-venv-v4-${{ hashFiles('pinyinquiz/requirements.txt') }}

      # 4. Setup Python Virtualenv (Tự động biên dịch nếu thiếu hoặc cache hỏng)
      - name: Setup Virtualenv & Dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ] || [ ! -f "$HOME/.venv/bin/manim" ]; then
            echo "🔧 Installing dependencies and compiling Manim virtual environment..."
            python -m venv ~/.venv
            source ~/.venv/bin/activate
            pip install --upgrade pip setuptools wheel
            pip install -r pinyinquiz/requirements.txt
          else
            echo "✅ Virtual environment restored successfully with Manim binary verified."
          fi
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      # 5. Caching Edge-TTS Speech Audio Files
      - name: Cache Edge-TTS Word Audio
        uses: actions/cache@v4
        with:
          path: pinyinquiz/assets/audio/words
          key: ${{ runner.os }}-edge-tts-${{ hashFiles('pinyinquiz/assets/audio/words/**') }}
          restore-keys: |
            ${{ runner.os }}-edge-tts-

      # 4. Setup Service Account Credentials
      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p pinyinquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > pinyinquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      # 5. Execute High-Speed Video Render & Upload
      - name: Execute Video Render & Upload
        working-directory: pinyinquiz
        env:
          INPUT_QUALITY: ${{ github.event.inputs.quality }}
          INPUT_ROW: ${{ github.event.inputs.row_id }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source ~/.venv/bin/activate
          QUALITY="${INPUT_QUALITY:-qh}"
          CMD="python scripts/run_batch.py --from-sheet --quality $QUALITY --upload-gdrive"
          if [ -n "$INPUT_ROW" ]; then
            CMD="$CMD --row-id $INPUT_ROW"
          fi
          echo "🚀 Executing Render Command: $CMD"
          eval $CMD

      # 6. Cleanup Credentials
      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f pinyinquiz/configs/service_account.json
          echo "Credentials cleaned up. Render workflow completed."

      # 7. Notify Workflow Failure to Telegram (Chỉ gửi khi có lỗi thật sự)
      - name: Notify Workflow Failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT_ID="${TELEGRAM_CHAT_ID:-1187577977}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MSG="🚨 <b>[GitHub Actions Lỗi] Pipeline Render Thất Bại!</b>%0A%0A• <b>Workflow:</b> <code>daily_render.yml</code>%0A• <b>Run ID:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">${{ github.run_id }}</a>"
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML" || true
          fi
