name: Hourly Pinyin TikTok Video Render Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 1 hour (at minute 0 of every hour, 24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Manim render quality (ql, qm, qh, qk)'
        required: false
        default: 'qh'
      row_id:
        description: 'Specific Row ID to render (leave empty to render all Pending)'
        required: false
        default: ''
      generate_ideas:
        description: 'Tự động tạo 5 bộ ý tưởng & metadata mới (true/false)'
        required: false
        default: 'false'

jobs:
  render_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache Pip Wheels for ultrafast install
      - name: Cache Pip Wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pinyinquiz/requirements.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Edge-TTS generated speech audio files
      - name: Cache Edge-TTS Word Audio
        uses: actions/cache@v4
        with:
          path: pinyinquiz/assets/audio/words
          key: ${{ runner.os }}-edge-tts-${{ hashFiles('pinyinquiz/assets/audio/words/**') }}
          restore-keys: |
            ${{ runner.os }}-edge-tts-

      - name: Install System Dependencies & CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev pkg-config libcairo2-dev \
            sox libsox-fmt-all fonts-noto-cjk fonts-wqy-zenhei fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f pinyinquiz/requirements.txt ]; then
            pip install -r pinyinquiz/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p pinyinquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > pinyinquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      # Optional: Sinh 5 ý tưởng + Metadata mới nếu được kích hoạt
      - name: Generate Daily Batches & Metadata
        working-directory: pinyinquiz
        env:
          GEN_IDEAS: ${{ github.event.inputs.generate_ideas }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          if [ "$GEN_IDEAS" = "true" ]; then
            echo "Generating 5 new HSK batches with social media metadata..."
            python scripts/generate_daily_batches.py
          else
            echo "Skipping batch generation (GEN_IDEAS != true)."
          fi

      # Thực thi kết xuất video Manim và tải lên Google Drive
      - name: Execute Video Render & Upload
        id: render_step
        working-directory: pinyinquiz
        env:
          INPUT_QUALITY: ${{ github.event.inputs.quality }}
          INPUT_ROW: ${{ github.event.inputs.row_id }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          QUALITY="$INPUT_QUALITY"
          if [ -z "$QUALITY" ]; then
            QUALITY="qh"
          fi
          
          CMD="python scripts/run_batch.py --from-sheet --quality $QUALITY --upload-gdrive"
          if [ -n "$INPUT_ROW" ]; then
            CMD="$CMD --row-id $INPUT_ROW"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f pinyinquiz/configs/service_account.json
          echo "Credentials cleaned up. Render workflow completed."
