name: Daily Pinyin TikTok Video Render

on:
  schedule:
    # Runs everyday at 03:00 AM GMT+7 (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Manim render quality (ql, qm, qh, qk)'
        required: false
        default: 'qh'
      row_id:
        description: 'Specific Row ID to render (leave empty to render all Pending)'
        required: false
        default: ''

jobs:
  render_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache Pip Wheels for ultrafast install
      - name: Cache Pip Wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Edge-TTS generated speech audio files
      - name: Cache Edge-TTS Word Audio
        uses: actions/cache@v4
        with:
          path: assets/audio/words
          key: ${{ runner.os }}-edge-tts-${{ hashFiles('assets/audio/words/**') }}
          restore-keys: |
            ${{ runner.os }}-edge-tts-

      # Cache apt packages
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/daily_render.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies & CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev pkg-config libcairo2-dev \
            fonts-noto-cjk fonts-wqy-zenhei fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > configs/service_account.json
            echo "Service account credentials configured."
          fi

      - name: Execute Daily Video Render & Upload
        env:
          RENDER_QUALITY: ${{ github.event.inputs.quality || 'qh' }}
          TARGET_ROW: ${{ github.event.inputs.row_id || '' }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          CMD="python scripts/run_batch.py --from-sheet --quality $RENDER_QUALITY --upload-gdrive"
          if [ -n "$TARGET_ROW" ]; then
            CMD="$CMD --row-id $TARGET_ROW"
          fi
          echo "Running: $CMD"
          eval $CMD

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f configs/service_account.json
          echo "Credentials cleaned up."
