name: VocabCN Auto-QC Gatekeeper Pipeline

on:
  schedule:
    # 05:00 AM VN (22:00 UTC) - Auto-QC Gatekeeper morning batch inspection
    - cron: '0 22 * * *'
    # 12:00 PM VN (05:00 UTC) - Auto-QC Gatekeeper noon batch inspection
    - cron: '0 5 * * *'
    # 20:00 PM VN (13:00 UTC) - Auto-QC Gatekeeper evening batch inspection
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Specific Row ID to QC (leave empty to inspect all Video rows)'
        required: false
        default: ''

concurrency:
  group: vocabcn-qc-pipeline
  cancel-in-progress: true

jobs:
  qc_inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vocabCNquiz/requirements.txt

      # 1. Install FFmpeg & System Dependencies
      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libpango1.0-dev libcairo2-dev || true

      # 2. Register Bundled CJK Fonts
      - name: Register Bundled CJK Fonts
        run: |
          mkdir -p ~/.fonts
          cp vocabCNquiz/assets/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f || true

      # 3. Setup Virtualenv & Dependencies
      - name: Setup Virtualenv & Dependencies
        run: |
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r vocabCNquiz/requirements.txt
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      # 4. Setup Service Account Credentials
      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p vocabCNquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > vocabCNquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      # 5. Run Auto-QC Gatekeeper
      - name: Run Auto-QC Gatekeeper
        working-directory: vocabCNquiz
        env:
          PYTHONPATH: .
          INPUT_ROW_ID: ${{ github.event.inputs.row_id }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source ~/.venv/bin/activate
          if [ -n "$INPUT_ROW_ID" ]; then
            python scripts/run_qc.py --row_id "$INPUT_ROW_ID"
          else
            python scripts/run_qc.py
          fi
