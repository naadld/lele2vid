name: Auto-QC Gatekeeper Pipeline (Pre-Publish Inspection)

on:
  schedule:
    # 06:30 AM VN (23:30 UTC) - 30 mins before 07:00 AM VN publishing cron
    - cron: '30 23 * * *'
    # 12:30 PM VN (05:30 UTC) - 30 mins before 13:00 PM VN publishing cron
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Specific Row ID to QC (leave empty to inspect all Video rows)'
        required: false
        default: ''

jobs:
  qc_inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache Python Virtual Environment
      - name: Cache Python Virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('pinyinquiz/requirements.txt') }}

      - name: Setup Virtualenv & Dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv ~/.venv
            source ~/.venv/bin/activate
            pip install --upgrade pip
            pip install -r pinyinquiz/requirements.txt
          fi
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p pinyinquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > pinyinquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      - name: Run Auto-QC Inspector
        working-directory: pinyinquiz
        env:
          INPUT_ROW: ${{ github.event.inputs.row_id }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CMD="python scripts/run_qc.py"
          if [ -n "$INPUT_ROW" ]; then
            CMD="$CMD --row-id $INPUT_ROW"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f pinyinquiz/configs/service_account.json
          echo "Credentials cleaned up. Auto-QC Gatekeeper finished."

      - name: Notify Auto-QC Failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT_ID="${TELEGRAM_CHAT_ID:-6800539169}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MSG="🚨 <b>[GitHub Actions Lỗi] Auto-QC Gatekeeper Thất Bại!</b>%0A%0A• <b>Workflow:</b> <code>auto_qc.yml</code>%0A• <b>Run ID:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">${{ github.run_id }}</a>%0A• Vui lòng kiểm tra log chi tiết trên GitHub Actions."
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML" || true
          fi
