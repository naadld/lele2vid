name: Auto-QC Gatekeeper Pipeline (Pre-Publish Inspection)

on:
  schedule:
    # 05:00 AM VN (22:00 UTC) - Auto-QC Gatekeeper duyệt video mẻ sáng
    - cron: '0 22 * * *'
    # 12:00 PM VN (05:00 UTC) - Auto-QC Gatekeeper duyệt video mẻ trưa
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Specific Row ID to QC (leave empty to inspect all Video rows)'
        required: false
        default: ''

concurrency:
  group: pinyin-qc-pipeline
  cancel-in-progress: true

jobs:
  qc_inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. Cache Python Virtual Environment (Khôi phục trong 2-3 giây)
      - name: Cache Python Virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-venv-22-${{ hashFiles('pinyinquiz/requirements.txt') }}

      # 2. Cache CJK Fonts (Khôi phục trong 1 giây)
      - name: Cache CJK Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-cjk-fonts-22

      # 3. Install System Dependencies & Fonts (CHỈ CHẠY KHI THIẾU CACHE - Bỏ qua 100% khi đã có Cache)
      - name: Install System Dependencies & Fonts (Only on Cache Miss)
        if: steps.cache-venv.outputs.cache-hit != 'true' || steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            pkg-config \
            libpango1.0-dev \
            libcairo2-dev \
            fonts-noto-cjk \
            fonts-wqy-zenhei || true
          mkdir -p ~/.fonts
          cp -r /usr/share/fonts/truetype/noto/* ~/.fonts/ 2>/dev/null || true
          cp -r /usr/share/fonts/truetype/wqy/* ~/.fonts/ 2>/dev/null || true
          fc-cache -f -v || true

      # 4. Setup Python Virtualenv (Chỉ biên dịch khi thiếu cache)
      - name: Setup Virtualenv & Dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv ~/.venv
            source ~/.venv/bin/activate
            pip install --upgrade pip setuptools wheel
            pip install -r pinyinquiz/requirements.txt
          fi
          echo "$HOME/.venv/bin" >> $GITHUB_PATH
          fc-cache -f -v || true

      # 2. Setup Service Account Credentials
      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p pinyinquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > pinyinquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      # 3. Run Auto-QC Inspector
      - name: Run Auto-QC Inspector
        working-directory: pinyinquiz
        env:
          INPUT_ROW: ${{ github.event.inputs.row_id }}
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CMD="python scripts/run_qc.py"
          if [ -n "$INPUT_ROW" ]; then
            CMD="$CMD --row-id $INPUT_ROW"
          fi
          echo "🚀 Executing Auto-QC Inspector: $CMD"
          eval $CMD

      # 4. Cleanup Credentials
      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f pinyinquiz/configs/service_account.json
          echo "Credentials cleaned up. Auto-QC workflow completed."
