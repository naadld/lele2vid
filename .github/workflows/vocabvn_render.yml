name: VocabVN Render Pipeline (1080x1920 60fps)

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Manim render quality (ql, qm, qh, qk)'
        required: false
        default: 'qh'
        type: choice
        options:
          - ql
          - qm
          - qh
          - qk
      row_id:
        description: 'Specific Row ID to render (leave empty to render all Pending)'
        required: false
        default: ''

concurrency:
  group: vocabvn-render-pipeline
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  render_videos:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vocabVNquiz/requirements.txt

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libpango1.0-dev libcairo2-dev || true

      - name: Register Bundled CJK Fonts
        run: |
          mkdir -p ~/.fonts
          cp vocabVNquiz/assets/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f || true

      - name: Setup Virtualenv & Dependencies
        run: |
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r vocabVNquiz/requirements.txt
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Cache Edge-TTS Word Audio
        uses: actions/cache@v4
        with:
          path: vocabVNquiz/assets/audio/words
          key: ${{ runner.os }}-vocabvn-edge-tts-${{ hashFiles('vocabVNquiz/assets/audio/words/**') }}
          restore-keys: |
            ${{ runner.os }}-vocabvn-edge-tts-

      - name: Setup Service Account Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p vocabVNquiz/configs
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCP_SERVICE_ACCOUNT_JSON" > vocabVNquiz/configs/service_account.json
            echo "Service account credentials configured."
          fi

      - name: Execute VocabVN Video Render & Upload
        working-directory: vocabVNquiz
        env:
          INPUT_QUALITY: ${{ github.event.inputs.quality }}
          INPUT_ROW: ${{ github.event.inputs.row_id }}
          GDRIVE_TARGET_FOLDER: '1Y240J5-oXA-UDm2IKvp7qCBVsRempbCB'
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source ~/.venv/bin/activate
          
          RENDER_CMD="python scripts/run_batch.py --quality ${INPUT_QUALITY:-qh}"
          if [ -n "$INPUT_ROW" ]; then
            RENDER_CMD="$RENDER_CMD --row_id $INPUT_ROW"
          fi
          
          echo "Executing: $RENDER_CMD"
          eval $RENDER_CMD
